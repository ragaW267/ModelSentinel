<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ModelVault — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--card:#161b22;--sub:#0e131a;
      --border:#30363d;--muted:#8b949e;--text:#c9d1d9;--heading:#f0f6fc;
      --green:#2ea043;--green-glow:#3fb950;--red:#f85149;--blue:#58a6ff;
      --amber:#d29922;--purple:#a371f7;
    }
    body{min-height:100vh;background:var(--bg);color:var(--text);
      font-family:'Inter',sans-serif;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:1rem;gap:1rem;}

    /* ── Wordmark ── */
    .wordmark{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.25rem;}
    .wm-shield{font-size:1.4rem;line-height:1;}
    .wm-name{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:500;
      color:var(--heading);letter-spacing:0.1em;}
    .wm-tag{font-size:0.68rem;color:var(--muted);letter-spacing:0.05em;text-align:center;}

    /* ── Card ── */
    .card{width:100%;max-width:400px;background:var(--card);
      border:1px solid var(--border);border-radius:12px;overflow:hidden;}

    /* ── Auth tabs ── */
    .auth-tabs{display:flex;border-bottom:1px solid var(--border);}
    .auth-tab{flex:1;padding:0.7rem;background:none;border:none;cursor:pointer;
      font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:500;color:var(--muted);
      border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;}
    .auth-tab.active{color:var(--green-glow);border-bottom-color:var(--green-glow);}

    /* ── Form ── */
    .form-body{padding:1.5rem 1.75rem 1rem;}
    .field{margin-bottom:1rem;}
    .field label{display:block;font-size:0.7rem;color:var(--muted);margin-bottom:0.35rem;
      letter-spacing:0.04em;text-transform:uppercase;}
    .field input{width:100%;background:var(--sub);border:1px solid var(--border);
      border-radius:7px;padding:0.55rem 0.8rem;font-size:0.85rem;
      font-family:'Inter',sans-serif;color:var(--heading);outline:none;transition:border-color 0.15s;}
    .field input:focus{border-color:var(--blue);}
    .field input::placeholder{color:#484f58;}

    /* ── Role picker ── */
    .role-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.04em;
      text-transform:uppercase;margin-bottom:0.5rem;display:block;}
    .role-picker{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:1.1rem;}
    .role-btn{padding:0.65rem 0.5rem;background:var(--sub);border:1px solid var(--border);
      border-radius:8px;cursor:pointer;text-align:center;transition:all 0.15s;user-select:none;}
    .role-btn:hover{border-color:var(--muted);}
    .role-btn.selected.client{border-color:var(--blue);background:rgba(88,166,255,0.08);}
    .role-btn.selected.server{border-color:var(--purple);background:rgba(163,113,247,0.08);}
    .role-icon{font-size:1.25rem;line-height:1;display:block;margin-bottom:0.3rem;}
    .role-name{font-size:0.78rem;font-weight:600;color:var(--heading);}
    .role-desc{font-size:0.65rem;color:var(--muted);margin-top:0.15rem;}
    .role-btn.selected.client .role-name{color:var(--blue);}
    .role-btn.selected.server .role-name{color:var(--purple);}

    /* ── Submit ── */
    .btn{width:100%;padding:0.65rem;border:none;border-radius:7px;
      font-size:0.82rem;font-weight:600;font-family:'Inter',sans-serif;
      cursor:pointer;letter-spacing:0.04em;transition:opacity 0.15s,filter 0.15s;}
    .btn.client-btn{background:var(--blue);color:#fff;}
    .btn.server-btn{background:var(--purple);color:#fff;}
    .btn:hover{filter:brightness(1.12);}
    .btn:disabled{opacity:0.45;cursor:not-allowed;}

    /* ── Message ── */
    .msg{margin-top:0.85rem;padding:0.5rem 0.75rem;border-radius:7px;
      font-size:0.76rem;display:none;}
    .msg.success{background:rgba(46,160,67,0.1);border:1px solid rgba(63,185,80,0.3);color:var(--green-glow);}
    .msg.error{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.3);color:var(--red);}
    .msg.show{display:block;}

    /* ── Redirect badge ── */
    .redirect-hint{display:none;align-items:center;gap:0.4rem;font-size:0.7rem;
      color:var(--muted);margin-top:0.75rem;}
    .redirect-hint.show{display:flex;}
    .redirect-dot{width:6px;height:6px;border-radius:50%;animation:pulse 1s ease-in-out infinite;}
    .redirect-dot.client{background:var(--blue);}
    .redirect-dot.server{background:var(--purple);}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

    /* ── Footer row ── */
    .card-footer{padding:0.6rem 1.75rem 0.9rem;border-top:1px solid var(--border);
      display:flex;align-items:center;gap:0.5rem;}
    .card-footer label{font-size:0.65rem;color:var(--muted);white-space:nowrap;font-family:'JetBrains Mono',monospace;}
    .card-footer input{flex:1;background:transparent;border:none;color:var(--muted);
      font-family:'JetBrains Mono',monospace;font-size:0.65rem;outline:none;}
  </style>
</head>
<body>

<div class="wordmark">
  <span class="wm-shield">🛡️</span>
  <span class="wm-name">MODELVAULT</span>
</div>
<div class="wm-tag">Adaptive AI Security Gateway</div>

<div class="card">

  <!-- Login / Register tabs -->
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login"    onclick="switchTab('login')">Sign In</button>
    <button class="auth-tab"        id="tab-register" onclick="switchTab('register')">Register</button>
  </div>

  <div class="form-body">

    <!-- Role picker -->
    <span class="role-label">I am a</span>
    <div class="role-picker">
      <div class="role-btn client selected" id="role-client" onclick="selectRole('client')">
        <span class="role-icon">💻</span>
        <div class="role-name">Client</div>
        <div class="role-desc">Send queries, view results</div>
      </div>
      <div class="role-btn server" id="role-server" onclick="selectRole('server')">
        <span class="role-icon">🖥️</span>
        <div class="role-name">Server Admin</div>
        <div class="role-desc">Monitor &amp; manage system</div>
      </div>
    </div>

    <!-- Credentials -->
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="e.g. admin" autocomplete="username"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn client-btn" id="submit-btn" onclick="submit()">SIGN IN AS CLIENT</button>

    <div class="msg" id="msg"></div>

    <div class="redirect-hint" id="redirect-hint">
      <span class="redirect-dot client" id="redirect-dot"></span>
      <span id="redirect-text">Redirecting to Client Console...</span>
    </div>

  </div>

  <!-- Server URL -->
  <div class="card-footer">
    <label>API ›</label>
    <input id="server-url" type="text" value="http://localhost:8000" spellcheck="false"/>
  </div>

</div>

<script>
  let mode = 'login';
  let selectedRole = 'client';

  // Read ?server= from URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('server')) document.getElementById('server-url').value = params.get('server');

  // ── Role selection ────────────────────────────────────
  function selectRole(role) {
    selectedRole = role;
    const clientEl = document.getElementById('role-client');
    const serverEl = document.getElementById('role-server');

    clientEl.className = 'role-btn client' + (role === 'client' ? ' selected' : '');
    serverEl.className = 'role-btn server' + (role === 'server' ? ' selected' : '');

    const btn = document.getElementById('submit-btn');
    const label = mode === 'login' ? 'SIGN IN' : 'CREATE ACCOUNT';
    if (role === 'client') {
      btn.className = 'btn client-btn';
      btn.textContent = label + ' AS CLIENT';
    } else {
      btn.className = 'btn server-btn';
      btn.textContent = label + ' AS SERVER ADMIN';
    }
    clearMsg();
  }

  // ── Tab switching ─────────────────────────────────────
  function switchTab(t) {
    mode = t;
    document.getElementById('tab-login').classList.toggle('active', t === 'login');
    document.getElementById('tab-register').classList.toggle('active', t === 'register');
    selectRole(selectedRole); // re-set button label
    clearMsg();
  }

  // ── Feedback ──────────────────────────────────────────
  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text; el.className = 'msg show ' + type;
  }
  function clearMsg() {
    document.getElementById('msg').className = 'msg';
    document.getElementById('redirect-hint').className = 'redirect-hint';
  }

  function showRedirect(role) {
    const hint = document.getElementById('redirect-hint');
    const dot  = document.getElementById('redirect-dot');
    const text = document.getElementById('redirect-text');
    dot.className  = 'redirect-dot ' + role;
    text.textContent = role === 'client'
      ? 'Redirecting to Client Console...'
      : 'Redirecting to Server Dashboard...';
    hint.className = 'redirect-hint show';
  }

  // ── Submit ────────────────────────────────────────────
  async function submit() {
    clearMsg();
    const username  = document.getElementById('username').value.trim();
    const password  = document.getElementById('password').value;
    const serverUrl = document.getElementById('server-url').value.replace(/\/$/, '');
    const btn       = document.getElementById('submit-btn');

    if (!username || !password) { showMsg('Please fill in both fields.', 'error'); return; }

    const endpoint = mode === 'login' ? '/auth/login' : '/auth/register';
    const savedLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'PLEASE WAIT...';

    try {
      const resp = await fetch(serverUrl + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, role: selectedRole }),
      });
      const data = await resp.json();

      if (resp.ok) {
        showMsg(data.message, 'success');

        if (mode === 'login') {
          // Use the role stored on the account (not just what's selected)
          const userRole = data.user.role || selectedRole;
          localStorage.setItem('mv_user', JSON.stringify(data.user));
          showRedirect(userRole);

          const dest = userRole === 'server'
            ? 'server-ui/index.html'
            : 'client-ui/index.html';

          setTimeout(() => {
            window.location.href = dest + '?server=' + encodeURIComponent(serverUrl);
          }, 900);

        } else {
          // Registration success — switch to login tab
          setTimeout(() => switchTab('login'), 1200);
        }

      } else {
        showMsg(data.detail || 'Something went wrong.', 'error');
      }

    } catch(e) {
      showMsg('Cannot reach server at ' + serverUrl, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = savedLabel;
    }
  }

  // Enter key submits
  document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>

</body>
</html>
